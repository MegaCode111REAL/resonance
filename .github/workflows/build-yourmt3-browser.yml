name: Build browser YourMT3 model

on:
  push:
    branches: ["feature/yourmt3-transcription"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Resonance
        uses: actions/checkout@v4

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Checkout official YourMT3 source
        run: git clone --depth 1 https://huggingface.co/spaces/mimbres/YourMT3 .build/YourMT3

      - name: Patch YourMT3 MoE for torch.export
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path(".build/YourMT3/amt/src/model/ff_layer.py")
          s = p.read_text()

          old_guard = "if top_x.shape[0] == 0:"
          new_guard = "if torch.fx.experimental.symbolic_shapes.guard_size_oblivious(top_x.shape[0] == 0):"
          if old_guard not in s:
              raise SystemExit("Expected YourMT3 MoE empty-expert guard was not found")
          s = s.replace(old_guard, new_guard, 1)

          old_indexing = "\n".join([
              "top_x_list = top_x.tolist()",
              "idx_list = idx.tolist()",
              "",
              "# Index the correct hidden states and compute the expert hidden state for",
          ])
          new_indexing = "\n".join([
              "# Keep expert routing indices as tensors. Python .tolist() creates",
              "# data-dependent values that torch.export cannot specialize.",
              "top_x_list = top_x",
              "idx_list = idx",
              "",
              "# Index the correct hidden states and compute the expert hidden state for",
          ])
          if old_indexing not in s:
              raise SystemExit("Expected YourMT3 MoE Python-list indexing block was not found")
          s = s.replace(old_indexing, new_indexing, 1)

          p.write_text(s)
          print("Patched", p)
          PY

      - name: Install YourMT3 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytorch-lightning einops wandb librosa soundfile mido pyyaml onnx onnxscript onnxruntime
          if [ -f .build/YourMT3/requirements.txt ]; then
            python -m pip install -r .build/YourMT3/requirements.txt
          fi
          # YourMT3 officially pins Transformers 4.45.1.
          python -m pip install --force-reinstall --no-deps transformers==4.45.1
          python - <<'PY'
          import transformers
          assert transformers.__version__ == "4.45.1", transformers.__version__
          print("Transformers:", transformers.__version__)
          PY

      - name: Download official no-pitch-shift checkpoint
        run: |
          mkdir -p .build/YourMT3/amt/logs/2024/mc13_256_g4_all_v7_mt3f_sqr_rms_moe_wf4_n8k2_silu_rope_rp_b36_nops/checkpoints
          curl -L --fail --retry 5 --retry-delay 5             "https://huggingface.co/mimbres/YourMT3/resolve/main/logs/2024/mc13_256_g4_all_v7_mt3f_sqr_rms_moe_wf4_n8k2_silu_rope_rp_b36_nops/checkpoints/last.ckpt?download=true"             -o .build/YourMT3/amt/logs/2024/mc13_256_g4_all_v7_mt3f_sqr_rms_moe_wf4_n8k2_silu_rope_rp_b36_nops/checkpoints/last.ckpt
          ls -lh .build/YourMT3/amt/logs/2024/mc13_256_g4_all_v7_mt3f_sqr_rms_moe_wf4_n8k2_silu_rope_rp_b36_nops/checkpoints/last.ckpt
          test "$(stat -c%s .build/YourMT3/amt/logs/2024/mc13_256_g4_all_v7_mt3f_sqr_rms_moe_wf4_n8k2_silu_rope_rp_b36_nops/checkpoints/last.ckpt)" -gt 500000000

      - name: Export encoder and decoder ONNX
        run: |
          python tools/export_yourmt3_onnx.py             --checkpoint .build/YourMT3/amt/logs/2024/mc13_256_g4_all_v7_mt3f_sqr_rms_moe_wf4_n8k2_silu_rope_rp_b36_nops/checkpoints/last.ckpt             --encoder-output dist/yourmt3-encoder.onnx             --decoder-output dist/yourmt3-decoder.onnx
          python tools/yourmt3_browser_metadata.py

      - name: Validate ONNX graphs
        run: |
          python - <<'PY'
          import onnx
          import onnxruntime as ort

          for path in ("dist/yourmt3-encoder.onnx", "dist/yourmt3-decoder.onnx"):
              model = onnx.load(path)
              onnx.checker.check_model(model)
              session = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
              print(path)
              print("  inputs:", [(x.name, x.shape, x.type) for x in session.get_inputs()])
              print("  outputs:", [(x.name, x.shape, x.type) for x in session.get_outputs()])
          PY

      - name: Publish browser model release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yourmt3-browser-v2
          name: Resonance YourMT3 browser model v2
          prerelease: true
          make_latest: false
          files: |
            dist/yourmt3-encoder.onnx
            dist/yourmt3-decoder.onnx
            dist/yourmt3-vocab.json
